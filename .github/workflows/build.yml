name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.webok.outputs.ok }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate scaffolds
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
        run: |
          flutter create /tmp/scaf --platforms=android,web --project-name my_tools --org com.khalid.mytools
          [ -d android ] || cp -r /tmp/scaf/android .
          [ -d web ] || cp -r /tmp/scaf/web .
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' $M
          grep -q 'android.permission.CAMERA' $M || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>#' $M
          grep -q 'gms.ads.APPLICATION_ID' $M || sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/>\n    </application>#" $M
          printf '%s\n' '-keep class * extends androidx.room.RoomDatabase { <init>(); }' '-keep class androidx.work.impl.WorkDatabase_Impl { <init>(); }' > android/app/proguard-rules.pro
          G=android/app/build.gradle.kts; [ -f $G ] || G=android/app/build.gradle
          if ! grep -q 'proguard-rules.pro' $G; then
            if [ "$G" = android/app/build.gradle.kts ]; then
              sed -i 's#^\( *\)release {#&\n\1    proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")#' $G
            else
              sed -i "s#^\( *\)release {#&\n\1    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'#" $G
            fi
          fi
          grep -q 'strictFullModeForKeepRules' android/gradle.properties || echo 'android.r8.strictFullModeForKeepRules=false' >> android/gradle.properties
          grep -n 'proguard' $G || echo "WARNING: proguard line not added to $G"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release --dart-define=ADMOB_BANNER=${{ vars.ADMOB_BANNER }} --dart-define=ADMOB_INTERSTITIAL=${{ vars.ADMOB_INTERSTITIAL }}
      - uses: actions/upload-artifact@v4
        with:
          name: my-tools-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - id: web
        continue-on-error: true
        run: flutter build web --release --base-href /my-tools/
      - id: webok
        if: steps.web.outcome == 'success'
        run: echo "ok=yes" >> "$GITHUB_OUTPUT"
      - if: steps.web.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    if: needs.build.outputs.web == 'yes'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
