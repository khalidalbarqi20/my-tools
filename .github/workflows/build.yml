name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    outputs:
      web: ${{ steps.webok.outputs.ok }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate scaffolds
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
        run: |
          flutter create /tmp/scaf --platforms=android,web --project-name my_tools --org com.khalid.mytools
          [ -d android ] || cp -r /tmp/scaf/android .
          [ -d web ] || cp -r /tmp/scaf/web .
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' $M
          grep -q 'android.permission.CAMERA' $M || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>#' $M
          for P in VIBRATE RECORD_AUDIO; do grep -q "android.permission.$P" $M || sed -i "s#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">#&\n    <uses-permission android:name=\"android.permission.$P\"/>#" $M; done
          grep -q 'gms.ads.APPLICATION_ID' $M || sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/>\n    </application>#" $M
          # FFmpeg يستدعي كلاساته من الكود الأصلي (JNI) وR8 يحذفها فيتعطل التطبيق عند الفتح، فنحميها هنا أيضًا
          # AdMob يجلب WorkManager، وR8 يحذف مُنشئ WorkDatabase_Impl فيتعطل التطبيق عند الفتح
          printf '%s\n' '-keep class * extends androidx.room.RoomDatabase { <init>(); }' '-keep class androidx.work.impl.WorkDatabase_Impl { <init>(); }' '-keep class com.arthenica.** { *; }' '-keep class com.antonkarpenko.** { *; }' '-dontwarn com.arthenica.**' '-dontwarn com.antonkarpenko.**' '-keep class kotlin.coroutines.Continuation { *; }' '-keep class kotlin.Unit { *; }' '-keep class kotlin.Result { *; }' '-keep class kotlin.Result$Failure { *; }' '-keep class kotlin.coroutines.intrinsics.CoroutineSingletons { *; }' > android/app/proguard-rules.pro
          G=android/app/build.gradle.kts; [ -f $G ] || G=android/app/build.gradle
          # مكتبة FFmpeg تتطلب أندرويد 7 (API 24) فأكثر
          sed -i 's#minSdk = flutter.minSdkVersion#minSdk = 24#; s#minSdkVersion flutter.minSdkVersion#minSdkVersion 24#' $G
          grep -n 'minSdk' $G || echo "WARNING: minSdk not found in $G"
          if ! grep -q 'proguard-rules.pro' $G; then
            if [ "$G" = android/app/build.gradle.kts ]; then
              sed -i 's#^\( *\)release {#&\n\1    proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")#' $G
            else
              sed -i "s#^\( *\)release {#&\n\1    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'#" $G
            fi
          fi
          grep -q 'strictFullModeForKeepRules' android/gradle.properties || echo 'android.r8.strictFullModeForKeepRules=false' >> android/gradle.properties
          grep -n 'proguard' $G || echo "WARNING: proguard line not added to $G"
      - name: PWA setup (installable, isolated from other projects)
        continue-on-error: true
        run: |
          cp web_pwa/manifest.json web/manifest.json
          cp web_pwa/my_tools_sw.js web/my_tools_sw.js
          cp web_pwa/mt_bg.js web/mt_bg.js
          mkdir -p web/icons
          cp web_pwa/icons/Icon-*.png web/icons/
          cp web_pwa/icons/favicon.png web/favicon.png
          python3 web_pwa/patch_index.py
      - name: Build web media engine (Mediabunny + ffmpeg.wasm)
        continue-on-error: true
        run: |
          set -e
          W="$GITHUB_WORKSPACE"
          mkdir -p /tmp/mb && cd /tmp/mb
          npm init -y >/dev/null
          npm i mediabunny@^1 @mediabunny/mp3-encoder@^1 @mediabunny/aac-encoder@^1 @ffmpeg/ffmpeg@0.12.15 @ffmpeg/core@0.12.10 esbuild@0.25
          cp "$W/web_pwa/media_entry.js" entry.js
          npx esbuild entry.js --bundle --format=esm --minify --outfile="$W/web/mt_media.js"
          mkdir -p "$W/web/ffmpeg"
          cp node_modules/@ffmpeg/ffmpeg/dist/esm/*.js "$W/web/ffmpeg/"
          cp node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.js node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.wasm "$W/web/ffmpeg/"
          ls -la "$W/web/mt_media.js" "$W/web/ffmpeg"
      - name: Add webview dependency (HTML runner on Android/iPhone)
        run: flutter pub add webview_flutter
      - run: flutter pub get
      - name: Hook "عملياتي السابقة" into Settings
        continue-on-error: true
        run: |
          rm -f /tmp/patched_file
          python3 web_pwa/patch_settings.py
          F=$(cat /tmp/patched_file 2>/dev/null || true)
          if [ -n "$F" ]; then
            if ! flutter analyze --no-fatal-infos --no-fatal-warnings "$F" > /tmp/pa.txt 2>&1; then
              cat /tmp/pa.txt
              cp "$F.orig" "$F"
              echo "::warning title=settings patch::reverted, analyzer rejected the change"
            fi
            rm -f "$F.orig"
          fi
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -E '(error|warning) •' analyze.txt | head -12 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$msg" ] || msg=$(tail -12 analyze.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter analyze::$msg"
          fi
          exit $code
      - name: Test
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          code=$?
          tail -60 test.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -n -E '\[E\]|Expected:|Actual:|Which:|Error:|Failed to load|error •' test.txt | head -14 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$msg" ] || msg=$(tail -15 test.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter test::$msg"
          fi
          exit $code
      - name: Build APK
        run: |
          B="flutter build apk --release --target-platform android-arm64 --dart-define=ADMOB_BANNER=${{ vars.ADMOB_BANNER }} --dart-define=ADMOB_INTERSTITIAL=${{ vars.ADMOB_INTERSTITIAL }} --dart-define=REMOTE_CONFIG_URL=${{ vars.REMOTE_CONFIG_URL }}"
          $B || { echo "retrying once (ffmpeg-kit downloads its native libraries on the first Gradle run)"; $B; }
      - uses: actions/upload-artifact@v4
        with:
          name: my-tools-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK as a release (direct download, no zip)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/app/outputs/flutter-apk/app-release.apk --title "latest APK" --notes "Latest APK, built from commit ${{ github.sha }}" --target ${{ github.sha }}
      - id: web
        continue-on-error: true
        run: flutter build web --release --base-href /my-tools/
      - id: webok
        if: steps.web.outcome == 'success'
        run: echo "ok=yes" >> "$GITHUB_OUTPUT"
      - if: steps.web.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    if: needs.build.outputs.web == 'yes'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
