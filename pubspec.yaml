name: my_tools
description: أدواتي اليومية
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.0
  device_info_plus: ^13.3.0
  battery_plus: ^7.0.0
  sensors_plus: ^6.0.0
  torch_light: ^1.1.0
  google_mobile_ads: ^9.1.0
  shared_preferences: ^2.3.0
  pdfrx: ^2.6.5
  pdf: ^3.11.0
  file_picker: ^13.1.0
  share_plus: ^13.2.1
  url_launcher: ^6.3.0
  timezone: ^0.9.4
  qr: ^3.0.2
  mobile_scanner: ^7.4.2
  flutter_image_compress: ^2.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
