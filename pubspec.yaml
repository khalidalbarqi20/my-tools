name: my_tools
description: أدواتي اليومية
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.0
  device_info_plus: ^13.3.0
  battery_plus: ^7.0.0
  sensors_plus: ^6.0.0
  torch_light: ^1.1.0
  vibration: ^3.1.3
  record: ^6.0.0
  audioplayers: ^6.1.0
  ffmpeg_kit_flutter_new_full: ^2.5.3
  video_player: ^2.9.0
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0
  hijri_core: ^1.1.0
  shared_preferences: ^2.3.0
  pdfrx: ^2.6.5
  pdf: ^3.11.0
  file_picker: ^13.1.0
  share_plus: ^13.2.1
  url_launcher: ^6.3.0
  timezone: ^0.9.4
  qr: ^3.0.2
  mobile_scanner: ^7.4.2
  flutter_image_compress: ^2.5.1
  google_mlkit_subject_segmentation: ^0.2.0
# النسخة 2.5.0 من shared_preferences_android تتعطل في نسخة release بسبب R8 (flutter/flutter#194649)
dependency_overrides:
  shared_preferences_android: '>=2.4.0 <2.5.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
